    <h1>Better Blends</h1>
    <p class="byline">by Alicia &amp; Chad</p>
    <p id="intro">Connect your Spotify once so the daily playlist can learn your taste.</p>
    <button id="login">Connect Spotify</button>
    <button id="logout" class="secondary" hidden>Sign out</button>
    <div id="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---- Fill these in (Supabase → Project Settings → API) ----
    const SUPABASE_URL = 'https://usycvnuypibkeatzkefj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_-tZwphZC_IDMm1QqHwbgEg_t9ozbvjZ';
    // ------------------------------------------------------------

    const SCOPES = 'user-top-read user-read-recently-played user-library-read playlist-modify-private playlist-modify-public';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = (id) => document.getElementById(id);

    $('login').onclick = () => db.auth.signInWithOAuth({
      provider: 'spotify',
      options: { scopes: SCOPES, redirectTo: window.location.origin + window.location.pathname }
    });

    $('logout').onclick = async () => { await db.auth.signOut(); location.reload(); };

    async function saveToken(session) {
      const { error } = await db.from('spotify_tokens').upsert({
        user_id: session.user.id,
        refresh_token: session.provider_refresh_token,
        updated_at: new Date().toISOString()
      });
      $('status').textContent = error
        ? '⚠️ Could not save your connection: ' + error.message
        : '✅ Connected! You can close this page.';
    }

    function showSignedIn(session) {
      const name = session.user.user_metadata?.full_name || session.user.email;
      $('intro').textContent = 'Signed in as ' + name + '.';
      $('login').hidden = true;
      $('logout').hidden = false;
    }

    db.auth.onAuthStateChange((event, session) => {
      if (!session) return;
      showSignedIn(session);
      // The Spotify refresh token is only present right after the Spotify redirect.
      if (session.provider_refresh_token) {
        saveToken(session);
      } else if (!$('status').textContent) {
        $('status').textContent = 'Already connected. To reconnect, sign out and connect again.';
      }
    });
  </script>
